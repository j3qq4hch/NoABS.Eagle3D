<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NoABS.Eagle3D glue tool</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1e1e1e; color: #d4d4d4;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  /* ── Toolbar ── */
  #toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: #2d2d2d;
    border-bottom: 1px solid #444; flex-shrink: 0;
  }
  #toolbar span { font-size: 13px; color: #888; margin-left: 8px; }
  .btn {
    padding: 5px 14px; border: 1px solid #555;
    background: #3c3c3c; color: #d4d4d4;
    border-radius: 4px; cursor: pointer; font-size: 13px;
    transition: background .15s;
  }
  .btn:hover { background: #505050; }
  .btn.primary { background: #0e639c; border-color: #1177bb; }
  .btn.primary:hover { background: #1177bb; }
  .btn:disabled { opacity: .4; cursor: default; }

  /* ── Main layout ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── Left panel: package list ── */
  #left-panel {
    width: 280px; min-width: 200px; max-width: 420px;
    display: flex; flex-direction: column;
    border-right: 1px solid #444; flex-shrink: 0;
  }
  #pkg-search {
    padding: 6px 8px; background: #252526;
    border-bottom: 1px solid #444; flex-shrink: 0;
  }
  #pkg-search input {
    width: 100%; padding: 4px 8px;
    background: #1e1e1e; border: 1px solid #555;
    color: #d4d4d4; border-radius: 3px; font-size: 13px;
  }
  #pkg-list { flex: 1; overflow-y: auto; list-style: none; }
  #pkg-list li {
    padding: 6px 12px; font-size: 13px;
    cursor: pointer; border-bottom: 1px solid #2a2a2a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 6px;
  }
  #pkg-list li:hover { background: #2a2d2e; }
  #pkg-list li.selected { background: #094771; }
  #pkg-list li.no-model { color: #f44; }
  #pkg-list li.no-orientation { color: #fa0; }
  #pkg-list li.ok { color: #4c4; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .dot.red    { background: #f44; }
  .dot.yellow { background: #fa0; }
  .dot.green  { background: #4c4; }

  /* ── Right panel ── */
  #right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Meta row ── */
  #meta-row {
    display: flex; gap: 8px; padding: 6px 10px;
    background: #252526; border-bottom: 1px solid #444;
    flex-shrink: 0; align-items: center;
  }
  #meta-row label { font-size: 12px; color: #888; white-space: nowrap; }
  #meta-row input {
    flex: 1; padding: 3px 7px;
    background: #1e1e1e; border: 1px solid #555;
    color: #d4d4d4; border-radius: 3px; font-size: 12px;
  }

  /* ── 3D viewport ── */
  #viewport { flex: 1; position: relative; overflow: hidden; background: #111; }
  #three-canvas { display: block; width: 100%; height: 100%; }
  #viewport-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    color: #555; font-size: 16px; pointer-events: none;
  }
  #loading-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; z-index: 10;
  }
  #loading-overlay.visible { display: flex; }
  .spinner {
    width: 36px; height: 36px; border: 3px solid #444;
    border-top-color: #0e9; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Viewport toolbar (top-right) ── */
  #viewport-toolbar {
    position: absolute; top: 8px; right: 8px;
    display: flex; gap: 4px; z-index: 5;
  }

  /* ── Viewport toolbar (top-left) ── */
  #viewport-toolbar-left {
    position: absolute; top: 8px; left: 8px;
    display: flex; gap: 4px; z-index: 5;
  }

  .vbtn {
    padding: 4px 10px; border: 1px solid #555;
    background: rgba(30,30,30,.85); color: #ccc;
    border-radius: 3px; cursor: pointer; font-size: 12px;
  }
  .vbtn:hover { background: rgba(60,60,60,.9); }
  .vbtn.active { border-color: #0e9; color: #0e9; }
  .vbtn.reload { border-color: #88f; color: #aaf; }
  .vbtn.reload:hover { background: rgba(80,60,120,.9); }

  /* ── Transform hint ── */
  #transform-hint {
    position: absolute; bottom: 8px; left: 8px;
    font-size: 11px; color: #666; pointer-events: none; z-index: 5;
  }

  /* ── Orientation fields ── */
  #orient-row {
    display: flex; gap: 4px; padding: 6px 10px;
    background: #252526; border-top: 1px solid #444;
    flex-shrink: 0; align-items: center; flex-wrap: wrap;
  }
  .orient-group { display: flex; align-items: center; gap: 3px; }
  .orient-group label { font-size: 11px; color: #888; min-width: 22px; text-align: right; }
  .orient-group input {
    width: 72px; padding: 3px 5px;
    background: #1e1e1e; border: 1px solid #555;
    color: #d4d4d4; border-radius: 3px; font-size: 12px; text-align: right;
  }
  #orient-sep { width: 1px; background: #444; height: 20px; margin: 0 4px; }

  /* ── Bottom bar ── */
  #bottom-bar {
    display: flex; justify-content: flex-end; align-items: center;
    padding: 6px 12px; background: #2d2d2d;
    border-top: 1px solid #444; flex-shrink: 0; gap: 8px;
  }
  #status-msg { flex: 1; font-size: 12px; color: #888; }

  /* ── Context menu ── */
  #ctx-menu {
    display: none;
    position: fixed;
    background: #2d2d2d;
    border: 1px solid #555;
    border-radius: 4px;
    z-index: 1000;
    min-width: 155px;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    padding: 4px 0;
  }
  .ctx-item {
    padding: 7px 16px;
    font-size: 13px;
    cursor: pointer;
    color: #d4d4d4;
    white-space: nowrap;
  }
  .ctx-item:hover { background: #094771; }
  .ctx-item.danger { color: #f88; }
  .ctx-item.danger:hover { background: #5a1a1a; }
  .ctx-sep {
    border: none;
    border-top: 1px solid #444;
    margin: 3px 0;
  }

  /* ── Downstream dialog ── */
  #downstream-dialog {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.65);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  #downstream-dialog-box {
    background: #2d2d2d;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 22px 24px 18px;
    min-width: 380px; max-width: 560px;
    box-shadow: 0 6px 24px rgba(0,0,0,.6);
  }
  #ds-msg {
    font-size: 14px;
    color: #d4d4d4;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  #downstream-dialog-btns {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  /* ── Name dialog ── */
  #name-dialog {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.65);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  #name-dialog-box {
    background: #2d2d2d;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 22px 24px 18px;
    min-width: 320px;
    box-shadow: 0 6px 24px rgba(0,0,0,.6);
  }
  #name-dialog-title {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 10px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  #name-input {
    width: 100%;
    padding: 6px 10px;
    background: #1e1e1e;
    border: 1px solid #555;
    color: #d4d4d4;
    border-radius: 3px;
    font-size: 14px;
    letter-spacing: .06em;
    outline: none;
  }
  #name-input:focus { border-color: #1177bb; }
  #name-error {
    font-size: 11px;
    color: #f66;
    min-height: 16px;
    margin-top: 5px;
  }
  #name-dialog-btns {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    justify-content: flex-end;
  }
</style>
</head>
<body>

<!-- ── Toolbar ── -->
<div id="toolbar">
  <button class="btn" onclick="downstream()" title="Downstream changes to library folder">Downstream</button>
  <button class="btn" onclick="openLibrary()">Open library</button>
  <span id="lib-name">No library loaded</span>
  <div style="flex:1"></div>
  <span id="step-dir-label" style="font-size:13px;color:#f44;margin-right:4px;text-align:right">STEP DIR NOT DEFINED</span>
  <button class="btn" onclick="setStepDir()" title="Choose folder with component STEP files">📁 Set step dir</button>
  <button class="btn" onclick="retessellateAll()" title="Delete all GLB cache and re-tessellate all STEP files">↺ Retessellate ALL</button>
</div>

<!-- ── Main ── -->
<div id="main">

  <!-- Left: package list -->
  <div id="left-panel">
    <div id="pkg-search">
      <input type="text" id="search-input" placeholder="Search..."
             oninput="filterPackages()">
    </div>
    <ul id="pkg-list"></ul>
  </div>

  <!-- Right: 3D viewer + controls -->
  <div id="right-panel">

    <!-- URLs -->
    <div id="meta-row">
      <label>Drawing:</label>
      <input type="text" id="drawing-url" placeholder="Datasheet / drawing URL"
             oninput="onMetaChange()">
      <label>3D model:</label>
      <input type="text" id="model-url" placeholder="3D model source URL"
             oninput="onMetaChange()">
    </div>

    <!-- 3D viewport -->
    <div id="viewport">
      <canvas id="three-canvas"></canvas>
      <div id="viewport-overlay">SELECT FOOTPRINT</div>

      <!-- Loading overlay -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        <span id="loading-text">Tessellating model...</span>
      </div>

      <!-- Top-left: Reload model + Load model buttons -->
      <div id="viewport-toolbar-left">
        <button class="vbtn reload" onclick="reloadModel()"
                title="Re-read STEP file and regenerate 3D model">↺ Reload model</button>
        <button class="vbtn reload" onclick="loadModelForCurrent()"
                title="Load a STEP file from disk for current footprint">📂 Load model…</button>
      </div>

      <!-- Top-right: view controls -->
      <div id="viewport-toolbar">
        <button class="vbtn active" id="btn-translate"
                onclick="setTransformMode('translate')" title="Translate (W)">⟷</button>
        <button class="vbtn" id="btn-rotate"
                onclick="setTransformMode('rotate')" title="Rotate (E)">↻</button>
        <span style="width:1px;background:#444;margin:0 3px;align-self:stretch"></span>
        <button class="vbtn" onclick="Viewer.setCameraPreset('top')"    title="Top view">⊤</button>
        <button class="vbtn" onclick="Viewer.setCameraPreset('bottom')" title="Bottom view">⊥</button>
        <button class="vbtn" onclick="Viewer.setCameraPreset('left')"   title="Left view">◁</button>
        <button class="vbtn" onclick="Viewer.setCameraPreset('right')"  title="Right view">▷</button>
        <span style="width:1px;background:#444;margin:0 3px;align-self:stretch"></span>
        <button class="vbtn" onclick="resetCamera()"    title="Reset camera">⌂ Cam</button>
        <button class="vbtn" onclick="resetComponent()" title="Reset component position">⌀ Comp</button>
      </div>

      <div id="transform-hint">LMB — orbit  MMB — pan  Wheel — zoom  |  RMB on gizmo — move/rotate component  W/E — translate/rotate mode</div>
    </div>

    <!-- Orientation fields -->
    <div id="orient-row">
      <button class="btn" id="btn-auto" onclick="autoPlace()" disabled
              title="Auto-place: center XY, touch Z=0 with bottom of model">Auto</button>
      <div id="orient-sep"></div>
      <div class="orient-group"><label>TX</label>
        <input type="number" id="f-tx" step="0.1" onchange="applyOrientFields()"></div>
      <div class="orient-group"><label>TY</label>
        <input type="number" id="f-ty" step="0.1" onchange="applyOrientFields()"></div>
      <div class="orient-group"><label>TZ</label>
        <input type="number" id="f-tz" step="0.1" onchange="applyOrientFields()"></div>
      <div id="orient-sep"></div>
      <div class="orient-group"><label>RX</label>
        <input type="number" id="f-rx" step="1" onchange="applyOrientFields()"></div>
      <div class="orient-group"><label>RY</label>
        <input type="number" id="f-ry" step="1" onchange="applyOrientFields()"></div>
      <div class="orient-group"><label>RZ</label>
        <input type="number" id="f-rz" step="1" onchange="applyOrientFields()"></div>
    </div>

  </div><!-- /right-panel -->
</div><!-- /main -->

<!-- ── Bottom bar ── -->
<div id="bottom-bar">
  <span id="status-msg"></span>
  <button class="btn primary" id="btn-apply" disabled onclick="applyAndSave()">Apply</button>
</div>

<!-- ── Context menu ── -->
<div id="ctx-menu">
  <div class="ctx-item" onclick="ctxRename()">✏ Rename</div>
  <div class="ctx-item" onclick="ctxDuplicate()">⧉ Duplicate</div>
  <hr class="ctx-sep">
  <div class="ctx-item danger" onclick="ctxDeleteStep()">✕ Delete step</div>
  <hr class="ctx-sep">
  <div class="ctx-item danger" onclick="ctxDelete()">🗑 Delete footprint</div>
</div>

<!-- ── Downstream dialog ── -->
<div id="downstream-dialog">
  <div id="downstream-dialog-box">
    <div id="ds-msg"></div>
    <div id="downstream-dialog-btns">
      <button class="btn" onclick="downstreamSpecify()">Specify library folder</button>
      <button class="btn" onclick="downstreamClose()">No</button>
      <button class="btn primary" id="ds-btn-yes" onclick="downstreamYes()">Yes</button>
    </div>
  </div>
</div>

<!-- ── Name dialog ── -->
<div id="name-dialog">
  <div id="name-dialog-box">
    <div id="name-dialog-title">TYPE NAME</div>
    <input type="text" id="name-input" autocomplete="off" spellcheck="false"
           oninput="onNameInput(event)">
    <div id="name-error"></div>
    <div id="name-dialog-btns">
      <button class="btn" onclick="nameDialogCancel()">Cancel</button>
      <button class="btn primary" onclick="nameDialogOK()">OK</button>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="app.js"></script>
<script>
  function _loadViewer() {
    var s = document.createElement("script");
    s.src = "three.min.js";
    s.onload = function() {
      var v = document.createElement("script");
      v.src = "viewer.js";
      v.onload = function() {
        var canvas = document.getElementById("three-canvas");
        Viewer.init(canvas);
        Viewer.onTransformChange(function(t) {
          setOrientFields(t.tx, t.ty, t.tz, t.rx, t.ry, t.rz);
          markDirty();
        });
        setStatus("Ready");
      };
      v.onerror = function() { setStatus("⚠ viewer.js failed to load", true); };
      document.head.appendChild(v);
    };
    s.onerror = function() { setStatus("⚠ Three.js failed to load", true); };
    document.head.appendChild(s);
  }
  window.addEventListener("DOMContentLoaded", _loadViewer);
</script>
</body>
</html>
